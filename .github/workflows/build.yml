name: Build Dolphin

on:
  push:
    branches: [ "test2" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
            qt_arch: win64_msvc2022_64
            cmake_arch: AMD64
          - arch: arm64
            msvc_arch: amd64_arm64
            qt_arch: win64_msvc2022_arm64_cross_compiled
            cmake_arch: ARM64

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-ccache-${{ matrix.arch }}-${{ github.ref_name }}
          restore-keys: |
            windows-ccache-${{ matrix.arch }}-

      - name: Install Ninja
        run: choco install ninja

      - name: Configure CMake
        run: >
          cmake -B build -S . -G Ninja 
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_arch }}
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Dolphin (Windows ${{ matrix.arch }} Release)
        run: |
          cmake --build build --config Release --target dolphin-emu --target dolphin-tool --parallel
          dir build\Binaries

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-${{ matrix.arch }}
          path: build/Binaries

  build-linux-flatpak:
    name: Build for Linux (Flatpak ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dolphin-linux-${{ matrix.arch }}.flatpak
          manifest-path: Flatpak/org.DolphinEmu.dolphin-emu.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.ref_name }}
          arch: ${{ matrix.arch }}

  build-macos:
    name: Build for macOS (Universal)
    runs-on: macos-14

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Install x86_64 Homebrew (for cross libraries)
        run: |
          if [ ! -x /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

      - name: Install arm64 dependencies (native Homebrew)
        run: |
          brew install cmake ninja qt ccache pkgconf

      - name: Install x86_64 dependencies (Homebrew under Rosetta)
        run: |
          arch -x86_64 /usr/local/bin/brew install qt pkgconf

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-ccache-universal-${{ github.ref_name }}
          restore-keys: |
            macos-ccache-universal-

      - name: Build macOS Universal Binary
        run: |
          mkdir -p build
          cd build
          python3 ../BuildMacOSUniversalBinary.py \
            -G Ninja \
            --target dolphin-emu \
            --dst_app universal \
            --ccache \
            --arm64_cmake_prefix /opt/homebrew \
            --x86_64_cmake_prefix /usr/local \
            --arm64_qt5_path "$(brew --prefix qt)" \
            --x86_64_qt5_path "$(arch -x86_64 /usr/local/bin/brew --prefix qt)"

      - name: Strip debug symbols and re-sign
        run: |
          APP="build/universal/Dolphin.app"
          find "$APP" -type f \( -perm -111 -o -name "*.dylib" \) -print0 \
            | xargs -0 -I{} strip -x "{}" 2>/dev/null || true
          codesign --force --deep --sign - "$APP"

      - name: Create DMG
        run: |
          cd build/universal
          mkdir -p dmg-src
          cp -R Dolphin.app dmg-src/
          ln -s /Applications dmg-src/Applications
          hdiutil create -volname "Dolphin" \
            -srcfolder dmg-src \
            -ov -format UDZO -imagekey zlib-level=9 \
            ../../dolphin-universal.dmg

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-universal
          path: dolphin-universal.dmg
