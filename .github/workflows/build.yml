name: Build Dolphin

on:
  push:
    branches: [ "test2" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
            qt_arch: win64_msvc2022_64
            cmake_arch: AMD64
          - arch: arm64
            msvc_arch: amd64_arm64
            qt_arch: win64_msvc2022_arm64_cross_compiled
            cmake_arch: ARM64

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-ccache-${{ matrix.arch }}-${{ github.ref_name }}
          restore-keys: |
            windows-ccache-${{ matrix.arch }}-

      - name: Install Ninja
        run: choco install ninja

      - name: Configure CMake
        run: >
          cmake -B build -S . -G Ninja 
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_arch }}
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Dolphin (Windows ${{ matrix.arch }} Release)
        run: cmake --build build --config Release --parallel

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-${{ matrix.arch }}
          path: build/Binaries

  build-linux-flatpak:
    name: Build for Linux (Flatpak ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dolphin-linux-${{ matrix.arch }}.flatpak
          manifest-path: Flatpak/org.DolphinEmu.dolphin-emu.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.ref_name }}
          arch: ${{ matrix.arch }}

  build-macos:
    name: Build for macOS (Universal)
    runs-on: macos-15

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-ccache-universal-${{ github.ref_name }}
          restore-keys: |
            macos-ccache-universal-

      - name: Install build tools
        run: |
          brew install cmake ninja llvm

      - name: Install Qt6 (Universal)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          cache: true

      - name: Build Dolphin (Universal)
        run: |
          mkdir build
          cd build
          python ../BuildMacOSUniversalBinary.py \
            -G Ninja \
            --x86_64_qt5_path "${{ env.QT_ROOT_DIR }}" \
            --arm64_qt5_path "${{ env.QT_ROOT_DIR }}" \
            --ccache

      - name: Package Universal DMG
        run: |
          find build/universal/Dolphin.app -type f -exec sh -c 'file "$1" | grep -q "Mach-O" && strip -x "$1"' _ {} \;
          ln -s /Applications build/universal/Applications
          hdiutil create -volname "Dolphin" -srcfolder build/universal/ -ov -format UDBZ build/Dolphin-Universal.dmg

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-macos-universal
          path: build/dolphin-universal.dmg
          if-no-files-found: error
