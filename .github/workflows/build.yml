name: Build Dolphin

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
            qt_arch: win64_msvc2022_64
            cmake_arch: AMD64
          - arch: arm64
            msvc_arch: amd64_arm64
            qt_arch: win64_msvc2022_arm64_cross_compiled
            cmake_arch: ARM64

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-ccache-${{ matrix.arch }}-${{ github.ref_name }}
          restore-keys: |
            windows-ccache-${{ matrix.arch }}-

      - name: Install Ninja
        run: choco install ninja

      - name: Configure CMake
        run: >
          cmake -B build -S . -G Ninja 
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_arch }}
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Dolphin
        run: cmake --build build --config Release --parallel

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-${{ matrix.arch }}
          path: build/Binaries


  build-macos:
    name: Build for macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          cache: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-ccache-universal-${{ github.ref_name }}
          restore-keys: |
            macos-ccache-universal-

      - name: Install Ninja
        run: brew install ninja

      - name: Configure CMake
        run: >
          cmake -B build -S . -G Ninja 
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Dolphin
        run: cmake --build build --config Release --parallel

      - name: Package DMG Installer
        working-directory: build
        run: cpack -G DragNDrop

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-macos-universal
          path: build/*.dmg
          if-no-files-found: error
