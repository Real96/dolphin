name: Build Dolphin

on:
  push:
    branches: [ "test2" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
            qt_arch: win64_msvc2019_64
          - arch: arm64
            msvc_arch: amd64_arm64
            # If linking fails for arm64 due to missing Qt binaries, you may need a newer 
            # Qt version (6.8+) or a specific ARM64 Qt string like win64_arm64_msvc2022_64.
            qt_arch: win64_msvc2019_64 

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: windows-ccache-${{ matrix.arch }}-${{ github.ref_name }}
          restore-keys: |
            windows-ccache-${{ matrix.arch }}-

      - name: Install Ninja
        run: choco install ninja

      - name: Configure CMake
        run: >
          cmake -B build -S . -G Ninja 
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Dolphin (Windows ${{ matrix.arch }} Release)
        run: cmake --build build --config Release --parallel

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-${{ matrix.arch }}
          path: build/Binaries

  build-linux-flatpak:
    name: Build for Linux (Flatpak ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm # Free for public repos, avoids slow QEMU emulation

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dolphin-linux-${{ matrix.arch }}.flatpak
          manifest-path: Flatpak/org.DolphinEmu.dolphin-emu.yml
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ github.ref_name }}
          arch: ${{ matrix.arch }}

  build-macos:
    name: Build for macOS (Universal)
    runs-on: macos-15

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-ccache-universal-${{ github.ref_name }}
          restore-keys: |
            macos-ccache-universal-

      - name: Install dependencies
        run: |
          brew install \
            cmake \
            ninja \
            ffmpeg \
            hidapi \
            xz \
            libusb \
            lzo \
            pkg-config \
            pugixml \
            qt6 \
            sfml

      - name: Configure CMake
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="install"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build Dolphin
        run: cmake --build build --config Release --parallel

      - name: Package macOS Build (DMG)
        working-directory: build
        run: cpack -G DragNDrop

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-macos-universal
          path: build/*.dmg
