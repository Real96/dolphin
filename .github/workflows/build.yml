name: Build Dolphin

on:
  push:
    branches: [ "test" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Dolphin (Windows x64 Release)
        run: cmake --build build --config Release --parallel 2

      - name: Package build
        run: Compress-Archive -Path build/Binaries/* -DestinationPath dolphin-windows-x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-windows-x64
          path: build/Binaries

  build-linux-flatpak:
    name: Build for Linux
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

  build-macos:
    name: Build for macOS
    runs-on: macos-15

    steps:
      - name: Checkout Dolphin Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            ffmpeg \
            hidapi \
            xz \
            libusb \
            lzo \
            pkg-config \
            pugixml \
            qt6 \
            sfml

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="install"

      - name: Build Dolphin
        run: cmake --build build --config Release --parallel 4

      - name: Package macOS Build (DMG)
        working-directory: build
        run: cpack -G DragNDrop

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-macos-universal
          path: build/*.dmg
